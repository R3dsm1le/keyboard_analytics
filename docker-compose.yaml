services:
  procesamiento:
    build:
      context: ./capa_de_procesamiento
      dockerfile: Dockerfile
    environment:
      - RUTA_CSV=${RUTA_CSV}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
    volumes:
      - datos_compartidos:/data

  analisis_de_negocio:
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    volumes:
      - datos_compartidos:/data
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    command: >
      bash -c "
      superset db upgrade &&
      superset init &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@localhost.com --password admin &&
      superset run -h 0.0.0.0 -p 8088 --with-threads
      "
    restart: unless-stopped

volumes:
  datos_compartidos: